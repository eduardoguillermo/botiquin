<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Botiquín</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6e56">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f5; --card:#ffffff; --border:#e1e5e3; --border-strong:#c7cdca;
    --text:#1b2624; --text-2:#5a655f; --text-muted:#8b948f;
    --accent:#0f6e56; --accent-bg:#e1f5ee; --accent-strong:#085041;
    --danger:#a32d2d; --danger-bg:#fcebeb;
    --warning:#854f0b; --warning-bg:#faeeda;
    --success:#3b6d11; --success-bg:#eaf3de;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- SPLASH ---------- */
  #splash{
    position:fixed; inset:0; background:var(--accent-strong); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:9999; text-align:center; padding:24px; cursor:pointer;
  }
  #splash h1{font-size:32px; font-weight:600; margin:0 0 8px;}
  #splash p.subtitle{font-size:15px; color:#cfe8de; margin:0 0 40px; max-width:320px;}
  #splash .dev{font-family:'Dancing Script',cursive; font-size:22px; margin-bottom:24px; opacity:0.9;}
  #splash .footer{font-family:monospace; font-size:12px; color:#a9d1c3; letter-spacing:0.5px;}
  #splash .hint{font-size:12px; color:#a9d1c3; margin-top:30px; opacity:0.8;}

  /* ---------- APP SHELL ---------- */
  #app{display:none; max-width:720px; margin:0 auto; padding-bottom:90px;}
  header.top{
    position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--border);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between; z-index:10;
  }
  header.top h2{margin:0; font-size:18px; font-weight:600;}
  header.top .actions{display:flex; gap:8px;}
  .icon-btn{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    color:var(--text-2); font-size:16px;
  }
  .icon-btn:active{transform:scale(0.96);}

  .metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px 16px 6px;}
  .metric{border-radius:var(--radius); padding:12px; background:var(--card); border:1px solid var(--border);}
  .metric.warn{background:var(--warning-bg); border-color:transparent;}
  .metric.danger{background:var(--danger-bg); border-color:transparent;}
  .metric .label{font-size:11px; color:var(--text-muted); margin:0;}
  .metric.warn .label{color:var(--warning);}
  .metric.danger .label{color:var(--danger);}
  .metric .value{font-size:22px; font-weight:600; margin:3px 0 0;}
  .metric.warn .value{color:var(--warning);}
  .metric.danger .value{color:var(--danger);}

  .search-wrap{padding:10px 16px;}
  .search-wrap input{
    width:100%; height:40px; border-radius:8px; border:1px solid var(--border);
    padding:0 12px; font-size:14px; background:var(--card);
  }
  .search-wrap input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-bg);}

  #list{padding:4px 16px 16px; display:flex; flex-direction:column; gap:10px;}
  .empty{text-align:center; color:var(--text-muted); padding:40px 20px; font-size:14px;}

  .item{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .item .row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .item .name{font-size:15px; font-weight:600; margin:0;}
  .item .meta{font-size:12px; color:var(--text-2); margin:3px 0 0;}
  .badge{font-size:11px; padding:3px 9px; border-radius:6px; white-space:nowrap; font-weight:500;}
  .badge.ok{background:var(--success-bg); color:var(--success);}
  .badge.soon{background:var(--warning-bg); color:var(--warning);}
  .badge.urgent{background:var(--danger-bg); color:var(--danger);}
  .low-stock{display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; color:var(--warning);}
  .item .row-actions{margin-top:10px; display:flex; gap:8px;}
  .item .row-actions button{
    flex:1; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--card);
    font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; color:var(--text);
  }
  .item .row-actions button.baja{color:var(--danger); border-color:#f0c9c9;}
  .item .row-actions button:active{transform:scale(0.98);}

  #fab{
    position:fixed; right:20px; bottom:20px; z-index:20;
    background:var(--accent); color:#fff; border:none; border-radius:28px;
    height:52px; padding:0 20px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  #fab:active{transform:scale(0.97);}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,25,22,0.5); z-index:100;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card); width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:18px 18px 24px; max-height:88vh; overflow-y:auto;
  }
  @media(min-width:640px){
    .overlay{align-items:center;}
    .sheet{border-radius:16px; margin-bottom:0;}
  }
  .sheet h3{margin:0 0 14px; font-size:17px; font-weight:600;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--text-2); margin-bottom:4px;}
  .field input, .field select{
    width:100%; height:40px; border-radius:8px; border:1px solid var(--border);
    padding:0 12px; font-size:14px; background:var(--bg);
  }
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .scan-btn{
    width:100%; height:44px; border-radius:8px; border:1px dashed var(--border-strong);
    background:var(--accent-bg); color:var(--accent-strong); font-size:14px; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px;
  }
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions button{flex:1; height:44px; border-radius:8px; border:1px solid var(--border); background:var(--card); font-size:14px; font-weight:500;}
  .sheet-actions button.primary{background:var(--accent); color:#fff; border:none;}
  #reader{width:100%; border-radius:8px; overflow:hidden; margin-bottom:14px; display:none;}
  .lookup-status{font-size:12px; color:var(--text-2); margin:-8px 0 12px;}

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed; left:16px; right:16px; bottom:20px; max-width:480px; margin:0 auto;
    background:var(--success-bg); border:1px solid #cfe3b5; color:var(--success);
    border-radius:10px; padding:10px 12px; display:none; align-items:center; gap:8px; z-index:200; font-size:13px;
  }
  #toast.show{display:flex;}
  #toast button{margin-left:auto; background:none; border:none; color:var(--success); font-weight:600; font-size:13px;}
</style>
</head>
<body>

<div id="splash">
  <h1>Botiquín</h1>
  <p class="subtitle">Control de medicamentos, vencimientos y stock del hogar</p>
  <div class="dev">Development by Guille</div>
  <div class="footer" id="splash-footer">Botiquín · -- · --:-- · v0.01 DEV</div>
  <div class="hint">Toca la pantalla o presioná Enter</div>
</div>

<div id="app">
  <header class="top">
    <h2>Botiquín</h2>
    <div class="actions">
      <button class="icon-btn" id="btnDrive" title="Conectar Google Drive">🔌</button>
      <button class="icon-btn" id="btnBackup" title="Backup ahora">☁️</button>
      <button class="icon-btn" id="btnExit" title="Salir">🚪</button>
    </div>
  </header>

  <div class="metrics">
    <div class="metric"><p class="label">Total</p><p class="value" id="mTotal">0</p></div>
    <div class="metric warn"><p class="label">Por vencer</p><p class="value" id="mSoon">0</p></div>
    <div class="metric danger"><p class="label">Vencidos</p><p class="value" id="mExpired">0</p></div>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="Buscar por producto o uso">
  </div>

  <div id="list"></div>

  <button id="fab">+ Agregar</button>
</div>

<div class="overlay" id="formOverlay">
  <div class="sheet">
    <h3 id="formTitle">Agregar medicamento</h3>

    <button class="scan-btn" id="btnScan">📷 Escanear código de barras</button>
    <div id="reader"></div>
    <div class="lookup-status" id="lookupStatus"></div>

    <div class="field">
      <label>Producto</label>
      <input type="text" id="fNombre" placeholder="Ej: Ibuprofeno 400mg">
    </div>
    <div class="field">
      <label>Para qué se usa</label>
      <input type="text" id="fUso" placeholder="Ej: Dolor, fiebre">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Cantidad de envases</label>
        <input type="number" id="fCantidad" min="0" step="1" value="1">
      </div>
      <div class="field">
        <label>Unidades por envase</label>
        <input type="number" id="fUnidadesPorEnvase" min="1" step="1" value="1" placeholder="Ej: 12">
      </div>
    </div>
    <div class="field">
      <label>Stock mínimo (en unidades totales)</label>
      <input type="number" id="fMinimo" min="0" step="1" value="1" placeholder="Ej: 24 comprimidos">
    </div>
    <div class="field">
      <label>Fecha de vencimiento</label>
      <input type="date" id="fVencimiento">
    </div>
    <div class="field">
      <label>Código de barras (opcional)</label>
      <input type="text" id="fCodigo" placeholder="Se completa al escanear">
    </div>

    <div class="sheet-actions">
      <button id="btnCancelForm">Cancelar</button>
      <button class="primary" id="btnSaveForm">Guardar</button>
    </div>
  </div>
</div>

<div id="toast">
  <span id="toastMsg"></span>
  <button id="toastUndo">Deshacer</button>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
